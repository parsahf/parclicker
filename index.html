<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ParClicker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 20px;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 17px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 40px 8%;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 30px;
            background: #1e293b;
            border-radius: 15px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .card p {
            color: #94a3b8;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 50px 20px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">ParClicker</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Download</a>
            <a href="#">License</a>
        </nav>
    </header>

    <section class="hero">
        <h1>ParClicker</h1>

        <p>
            A simple and fast auto clicker.
        </p>

        <a href="#" class="button">
            Download
        </a>
    </section>

    <section class="features">

        <div class="card">
            <h3>⚡ Fast</h3>
            <p>
                Fast and lightweight clicking.
            </p>
        </div>

        <div class="card">
            <h3>🎯 Simple</h3>
            <p>
                Easy to use with a simple interface.
            </p>
        </div>

        <div class="card">
            <h3>🔑 License</h3>
            <p>
                Subscription and license system.
            </p>
        </div>

    </section>

    <footer>
        ParClicker © 2026
    </footer>

</body>
</html>
