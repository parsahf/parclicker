```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>پرداخت | ParClicker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #080808,
                    #151515
                );

            color: white;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 500px;
        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 25px;
        }


        .card {

            background: #111;

            border:
                1px solid #292929;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.35);
        }


        h1 {

            margin-top: 0;

            margin-bottom: 25px;

            text-align: center;

            font-size: 25px;
        }


        .row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 14px 0;

            border-bottom:
                1px solid #242424;
        }


        .row:last-of-type {

            border-bottom: none;

        }


        .label {

            color: #999;

        }


        .value {

            font-weight: bold;

            direction: ltr;

            text-align: left;
        }


        .price {

            color: #facc15;

            font-size: 24px;
        }


        .status {

            margin-top: 25px;

            padding: 14px;

            border-radius: 12px;

            background: #1b1b1b;

            color: #facc15;

            text-align: center;

        }


        .pay-button {

            width: 100%;

            border: none;

            cursor: pointer;

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            background: white;

            color: black;

            transition: 0.2s;
        }


        .pay-button:hover {

            background: #ddd;

            transform:
                translateY(-1px);
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #aaa;

            text-decoration: none;
        }


        .back:hover {

            color: white;

        }


        .error {

            color: #f87171;

            text-align: center;

            padding: 20px;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        ParClicker
    </div>


    <div class="card">


        <h1>
            💳 پرداخت سفارش
        </h1>


        <div id="content">

            در حال دریافت اطلاعات سفارش...

        </div>


    </div>


</div>



<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const orderId =
    params.get("order_id");



async function loadOrder() {


    const content =
        document.getElementById(
            "content"
        );


    if (!orderId) {

        content.innerHTML = `
            <div class="error">
                شماره سفارش مشخص نشده است.
            </div>
        `;

        return;
    }


    try {


        const response =
            await fetch(
                "/api/order/" +
                orderId,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            content.innerHTML = `
                <div class="error">
                    ${data.message}
                </div>
            `;

            return;
        }


        const order =
            data.order;


        let statusText =
            "در انتظار پرداخت";


        if (
            order.status === "paid"
        ) {

            statusText =
                "پرداخت شده";

        }


        content.innerHTML = `

            <div class="row">

                <span class="label">
                    شماره سفارش
                </span>

                <span class="value">
                    #${order.id}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    ID نرم‌افزار
                </span>

                <span class="value">
                    ${order.software_id}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    سرعت
                </span>

                <span class="value">
                    ${order.cps} CPS
                </span>

            </div>


            <div class="row">

                <span class="label">
                    مدت اشتراک
                </span>

                <span class="value">
                    ${order.months} ماه
                </span>

            </div>


            <div class="row">

                <span class="label">
                    مبلغ
                </span>

                <span class="value price">
                    ${Number(
                        order.price
                    ).toLocaleString(
                        "fa-IR"
                    )} تومان
                </span>

            </div>


            <div class="status">

                وضعیت:
                ${statusText}

            </div>


            ${
                order.status === "pending"
                ?

                `
                <button
                    class="pay-button"
                    onclick="fakePayment()"
                >
                    💳 پرداخت آزمایشی
                </button>
                `

                :

                `
                <div
                    style="
                        margin-top:20px;
                        text-align:center;
                        color:#4ade80;
                    "
                >
                    این سفارش قبلاً پرداخت شده است.
                </div>
                `
            }


            <a
                href="/dashboard"
                class="back"
            >
                ← بازگشت به داشبورد
            </a>

        `;


    } catch (error) {

        console.error(error);

        content.innerHTML = `
            <div class="error">
                خطا در ارتباط با سرور
            </div>
        `;

    }

}



async function fakePayment() {


    if (
        !confirm(
            "این یک پرداخت آزمایشی است. ادامه می‌دهید؟"
        )
    ) {

        return;

    }


    try {


        const response =
            await fetch(
                "/api/order/" +
                orderId +
                "/fake-pay",
                {
                    method: "POST",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                data.message
            );

            return;

        }


        alert(
            "پرداخت آزمایشی با موفقیت انجام شد."
        );


        window.location.href =
            "/dashboard";


    } catch (error) {

        console.error(error);

        alert(
            "خطا در ارتباط با سرور"
        );

    }

}



loadOrder();


</script>


</body>

</html>
```
