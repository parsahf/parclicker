<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ثبت‌نام | ParClicker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Tahoma, Arial, sans-serif;

            background: #0b0f19;

            color: white;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        .logo {

            text-align: center;

            font-size: 34px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #9ca3af;

            margin-bottom: 30px;

        }


        .box {

            background: #111827;

            border: 1px solid #1f2937;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.35);

        }


        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #d1d5db;

        }


        input {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #374151;

            background: #0b1220;

            color: white;

            margin-bottom: 18px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #6366f1;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #6366f1;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #4f46e5;

        }


        #message {

            text-align: center;

            margin-top: 18px;

            min-height: 22px;

            line-height: 1.8;

        }


        .login {

            text-align: center;

            margin-top: 22px;

            color: #9ca3af;

        }


        .login a {

            color: #818cf8;

            text-decoration: none;

        }


        .login a:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="logo">

            ParClicker

        </div>


        <div class="subtitle">

            ساخت حساب کاربری

        </div>



        <div class="box">


            <h1>

                📝 ثبت‌نام

            </h1>



            <form id="signupForm">


                <label for="username">

                    نام کاربری

                </label>


                <input
                    type="text"
                    id="username"
                    placeholder="نام کاربری"
                    required
                    autocomplete="username"
                >



                <label for="password">

                    رمز عبور

                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="رمز عبور"
                    required
                    autocomplete="new-password"
                >



                <label for="password2">

                    تکرار رمز عبور

                </label>


                <input
                    type="password"
                    id="password2"
                    placeholder="تکرار رمز عبور"
                    required
                    autocomplete="new-password"
                >



                <button type="submit">

                    ساخت حساب

                </button>


            </form>



            <div id="message"></div>



            <div class="login">

                قبلاً حساب ساخته‌اید؟

                <a href="/login-page">

                    وارد شوید

                </a>

            </div>


        </div>


    </div>



    <script>


        const form =
            document.getElementById(
                "signupForm"
            );


        const message =
            document.getElementById(
                "message"
            );



        form.addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();



                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();



                const password =
                    document.getElementById(
                        "password"
                    ).value;



                const password2 =
                    document.getElementById(
                        "password2"
                    ).value;



                // بررسی رمزها

                if (password !== password2) {

                    message.style.color =
                        "#ef4444";

                    message.textContent =
                        "❌ رمزهای عبور یکسان نیستند.";

                    return;

                }



                if (username.length < 3) {

                    message.style.color =
                        "#ef4444";

                    message.textContent =
                        "❌ نام کاربری باید حداقل ۳ حرف باشد.";

                    return;

                }



                if (password.length < 6) {

                    message.style.color =
                        "#ef4444";

                    message.textContent =
                        "❌ رمز عبور باید حداقل ۶ کاراکتر باشد.";

                    return;

                }



                message.style.color =
                    "#9ca3af";

                message.textContent =
                    "در حال ساخت حساب...";



                try {


                    const response =
                        await fetch(
                            "/register",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            password

                                    })

                            }
                        );



                    const data =
                        await response.json();



                    if (data.success) {


                        message.style.color =
                            "#22c55e";


                        message.textContent =
                            "✅ حساب با موفقیت ساخته شد. در حال انتقال به صفحه ورود...";



                        setTimeout(
                            function() {

                                window.location.href =
                                    "/login-page";

                            },
                            1000
                        );


                    } else {


                        message.style.color =
                            "#ef4444";


                        message.textContent =
                            "❌ " + data.message;

                    }


                } catch (error) {


                    message.style.color =
                        "#ef4444";


                    message.textContent =
                        "❌ اتصال به سرور برقرار نشد.";

                }

            }
        );

    </script>


</body>

</html>
